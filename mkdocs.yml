site_name: NR/6G CSI Tracker
site_description: arXiv 논문 리뷰 · 3GPP RAN1 Tdoc 요약 (NR/6G CSI 압축·예측·획득)
site_url: https://jgunmoon.github.io/csi-paper-tracker/
repo_url: https://github.com/jgunmoon/csi-paper-tracker
repo_name: jgunmoon/csi-paper-tracker
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true   # compare.md links rely on /papers/<id>/ URLs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/brightness-7, name: 다크 모드}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/brightness-4, name: 라이트 모드}

hooks:
  - scripts/mkdocs_hooks.py   # footer: last update time (KST), paper/Tdoc counts

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md   # generated by scripts/gen_pages.py
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}   # Korean anchors, e.g. #점수-근거
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/compare.js
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
